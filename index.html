<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Combiner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="wordmark">IMAGE COMBINER</h1>
    <div id="account" class="account" hidden>
      <span id="account-name" class="account-name"></span>
      <button id="logout" class="pill" type="button">Log out</button>
    </div>
  </header>

  <main id="auth" class="container auth" hidden>
    <div class="auth-card">
      <div class="tabs">
        <button class="tab" type="button" data-mode="login">Log in</button>
        <button class="tab" type="button" data-mode="signup">Sign up</button>
      </div>
      <form id="auth-form" class="auth-form">
        <label id="name-field" class="input-field">
          <span class="label">Name</span>
          <input id="auth-name" type="text" autocomplete="name" maxlength="100" />
        </label>
        <label class="input-field">
          <span class="label">Email</span>
          <input id="auth-email" type="email" autocomplete="email" required />
        </label>
        <div class="input-field">
          <label class="label" for="auth-password">Password</label>
          <div class="password-wrap">
            <input id="auth-password" type="password" minlength="6" required />
            <button id="password-toggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z" />
                <circle cx="12" cy="12" r="3.25" />
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M9.9 5.3A9.6 9.6 0 0 1 12 5c6.5 0 10.5 7 10.5 7a17.6 17.6 0 0 1-3.6 4.3M6.5 7.1A17.4 17.4 0 0 0 1.5 12S5.5 19 12 19a9.9 9.9 0 0 0 4.2-.9" />
                <path d="M9.9 9.9a3.25 3.25 0 0 0 4.3 4.3" />
                <path d="M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>
        <button id="auth-submit" class="primary" type="submit">Log in</button>
        <p id="auth-error" class="error" role="alert"></p>
        <p id="auth-message" class="notice" role="status"></p>
      </form>
    </div>
  </main>

  <main id="app" class="container" hidden>
    <p class="subtitle">Upload two images and combine them into one.</p>

    <section class="uploads">
      <div class="field">
        <h2 class="label">Image 1</h2>
        <label class="upload-card" data-slot="image1">
          <input type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
          <div class="empty">
            <span class="plus" aria-hidden="true">+</span>
            <span class="empty-title">Upload image</span>
            <span class="empty-hint">JPG, PNG or WebP</span>
          </div>
          <img class="preview" alt="Image 1 preview" hidden />
          <span class="pill replace" hidden>Replace</span>
        </label>
      </div>

      <div class="field">
        <h2 class="label">Image 2</h2>
        <label class="upload-card" data-slot="image2">
          <input type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
          <div class="empty">
            <span class="plus" aria-hidden="true">+</span>
            <span class="empty-title">Upload image</span>
            <span class="empty-hint">JPG, PNG or WebP</span>
          </div>
          <img class="preview" alt="Image 2 preview" hidden />
          <span class="pill replace" hidden>Replace</span>
        </label>
      </div>
    </section>

    <div class="actions">
      <button id="generate" class="primary" type="button" disabled>Generate Image</button>
      <p id="error" class="error" role="alert"></p>
    </div>

    <section class="field">
      <h2 class="label">Generated Image</h2>
      <div id="result" class="result-card">
        <p class="placeholder">Your generated image will appear here.</p>
        <div class="loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Generating...</span>
        </div>
        <img class="result-img" alt="Generated image" hidden />
      </div>
      <a id="download" class="pill download" download="generated-image" hidden>Download</a>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
